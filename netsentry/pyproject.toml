[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentry-pcap"
version = "1.0.0"
description = "Offline PCAP summaries and simple defensive network-triage heuristics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scapy>=2.6,<3.0"]
license = { file = "LICENSE" }
authors = [{ name = "NetSentry contributors" }]

[project.scripts]
netsentry = "netsentry.cli:main"

[tool.setuptools]
packages = ["netsentry"]
